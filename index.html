<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Looper</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --floor:#101114;--enc-top:#2b2e35;--enc-bot:#1a1c20;--edge:#3b3f48;
  --ink:#ece6d8;--dim:#8a8f99;--rec:#e0453a;--play:#4fcb8a;--dub:#f2b33d;--well:#0d0e10;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--floor) radial-gradient(ellipse at 50% -10%,#22242a,#0d0e10 65%);
  font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:20px}
.pedal{width:min(430px,100%);background:linear-gradient(180deg,var(--enc-top),var(--enc-bot));border:1px solid var(--edge);
  border-radius:20px;padding:22px 22px 26px;box-shadow:0 30px 60px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06)}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;letter-spacing:.08em;line-height:1}
.brand span{color:var(--dim);font-weight:500;font-size:14px;letter-spacing:.2em;margin-left:8px}
.sr{font-size:11px;color:var(--dim)}

/* display well */
.well{background:var(--well);border:1px solid #000;border-radius:10px;padding:12px 14px;box-shadow:inset 0 2px 8px rgba(0,0,0,.8)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.status{font-family:"Barlow Condensed",sans-serif;font-size:22px;letter-spacing:.12em;font-weight:700}
.status.rec{color:var(--rec)}.status.play{color:var(--play)}.status.dub{color:var(--dub)}
.time{font-size:12px;color:var(--dim)}
.meter{height:6px;background:#1b1d22;border-radius:3px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--play),var(--dub) 75%,var(--rec));transition:width .05s linear}

/* footswitch + ring */
.stage{display:flex;justify-content:center;margin:22px 0 14px;position:relative}
.ringwrap{position:relative;width:200px;height:200px}
.ringwrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.track{fill:none;stroke:#0c0d0f;stroke-width:8}
.prog{fill:none;stroke:var(--play);stroke-width:8;stroke-linecap:butt;stroke-dasharray:1 1;transition:stroke .2s}
.foot{position:absolute;inset:20px;border-radius:50%;border:none;cursor:pointer;
  background:radial-gradient(circle at 40% 35%,#5a5e68,#2a2d33 60%,#17191c);
  box-shadow:0 8px 0 #0a0b0c,0 14px 22px rgba(0,0,0,.6),inset 0 2px 2px rgba(255,255,255,.15);
  color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:34px;letter-spacing:.14em;
  transition:transform .06s,box-shadow .06s}
.foot:active,.foot.down{transform:translateY(6px);box-shadow:0 2px 0 #0a0b0c,0 6px 12px rgba(0,0,0,.6),inset 0 2px 2px rgba(255,255,255,.1)}
.foot:focus-visible{outline:2px solid var(--dub);outline-offset:4px}
.foot small{display:block;font-size:11px;letter-spacing:.2em;color:var(--dim);font-weight:500;margin-top:2px}
.led{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#2a2d33;box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
.led.rec{background:var(--rec);box-shadow:0 0 12px var(--rec)}
.led.play{background:var(--play);box-shadow:0 0 12px var(--play)}
.led.dub{background:var(--dub);box-shadow:0 0 12px var(--dub)}

/* small controls */
.ctrls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.btn{background:#1f2227;border:1px solid var(--edge);color:var(--ink);border-radius:8px;padding:10px 6px;font:inherit;font-size:11px;letter-spacing:.1em;cursor:pointer}
.btn:hover{background:#262a30}.btn:disabled{opacity:.35;cursor:default}
.btn.on{border-color:var(--dub);color:var(--dub)}
.btn:focus-visible{outline:2px solid var(--dub);outline-offset:2px}

.layers{margin-top:16px;display:flex;flex-direction:column;gap:6px;min-height:34px}
.layer{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:#1a1c20;border:1px solid #2a2d33;border-radius:8px;padding:8px 10px;font-size:11px}
.layer .name{color:var(--dim);letter-spacing:.08em}
.layer input[type=range]{width:100%;accent-color:var(--play)}
.layer .m{width:26px;height:26px;border-radius:6px;border:1px solid var(--edge);background:#1f2227;color:var(--ink);cursor:pointer;font:inherit;font-size:10px}
.layer .m.off{color:var(--dim);border-color:#2a2d33;background:#141518}
.layer .x{background:none;border:none;color:var(--dim);cursor:pointer;font:inherit;font-size:14px}
.empty{color:var(--dim);font-size:11px;text-align:center;padding:8px}

.foot-note{margin-top:16px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--dim);flex-wrap:wrap;gap:8px}
.foot-note label{display:flex;align-items:center;gap:6px}
.foot-note input[type=number]{width:56px;background:#0d0e10;border:1px solid var(--edge);color:var(--ink);border-radius:5px;padding:3px 5px;font:inherit;font-size:11px}
.warn{margin-top:12px;font-size:11px;color:var(--rec);text-align:center;display:none}
@media (prefers-reduced-motion:reduce){.foot,.meter i{transition:none}}
</style>
</head>
<body>
<div class="pedal">
  <div class="head">
    <div class="brand">LOOPER<span>RC-∞</span></div>
    <div class="sr" id="srate">—</div>
  </div>

  <div class="well">
    <div class="row">
      <div class="status" id="status">READY</div>
      <div class="time" id="time">no loop</div>
    </div>
    <div class="meter"><i id="meter"></i></div>
  </div>

  <div class="stage">
    <div class="ringwrap">
      <svg viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="94"/><circle class="prog" id="prog" cx="100" cy="100" r="94"/></svg>
      <button class="foot" id="foot" aria-label="Record / play / overdub"><div class="led" id="led"></div>REC<small>TAP TO ARM</small></button>
    </div>
  </div>

  <div class="ctrls">
    <button class="btn" id="stop">STOP</button>
    <button class="btn" id="undo">UNDO</button>
    <button class="btn" id="clear">CLEAR</button>
    <button class="btn" id="export">WAV ↓</button>
  </div>

  <div class="layers" id="layers"><div class="empty">no layers yet — step on the switch to start</div></div>

  <div class="foot-note">
    <button class="btn" id="monitor" style="padding:6px 10px">MONITOR OFF</button>
    <label>latency comp <input type="number" id="lat" value="0" step="5"> ms</label>
    <span>space = switch · S = stop · Z = undo</span>
  </div>
  <div class="warn" id="warn"></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const ui = {status:$('status'),time:$('time'),meter:$('meter'),prog:$('prog'),foot:$('foot'),led:$('led'),
              layers:$('layers'),warn:$('warn'),srate:$('srate'),lat:$('lat'),monitor:$('monitor')};
  const CIRC = 2*Math.PI*94;
  ui.prog.style.strokeDasharray = `0 ${CIRC}`;

  let ctx, micSrc, proc, analyser, monGain, master;
  let sr = 48000;
  let loopLen = 0;             // samples
  let loopStart = 0;           // ctx time when position 0 last passed
  let layers = [];             // {buf, gain, src, muted, vol}
  let state = 'idle';          // idle | recbase | play | dub | stopped
  let capturing = false, capChunks = [], capCount = 0, capStartPos = 0, capStartTime = 0;
  let monitoring = false;

  function latencySamples(){
    const sys = (ctx.baseLatency||0) + (ctx.outputLatency||0);
    return Math.round((sys + (parseFloat(ui.lat.value)||0)/1000) * sr);
  }
  function posSamples(){ return ((ctx.currentTime - loopStart) * sr) % loopLen; }
  function fmt(s){ return s.toFixed(2)+'s'; }

  async function init(){
    if (ctx) return true;
    try {
      ctx = new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
      const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      sr = ctx.sampleRate; ui.srate.textContent = sr+' Hz';
      micSrc = ctx.createMediaStreamSource(stream);
      analyser = ctx.createAnalyser(); analyser.fftSize = 512;
      proc = ctx.createScriptProcessor(1024,1,1);
      master = ctx.createGain(); master.connect(ctx.destination);
      monGain = ctx.createGain(); monGain.gain.value = 0; monGain.connect(master);
      micSrc.connect(analyser); micSrc.connect(proc); micSrc.connect(monGain);
      proc.connect(ctx.destination); // must be connected to fire
      proc.onaudioprocess = e => {
        if (!capturing) return;
        const d = e.inputBuffer.getChannelData(0);
        capChunks.push(new Float32Array(d)); capCount += d.length;
        if (state==='dub' && capCount >= loopLen) finishDub();
      };
      requestAnimationFrame(tick);
      return true;
    } catch(err){
      ui.warn.style.display='block';
      ui.warn.textContent = 'Mic access is required. Allow the microphone and tap again.';
      ctx = null; return false;
    }
  }

  function setStatus(txt, cls, footTxt, sub){
    ui.status.textContent = txt; ui.status.className = 'status '+(cls||'');
    ui.led.className = 'led '+(cls||'');
    ui.foot.innerHTML = `<div class="led ${cls||''}" id="led"></div>${footTxt}<small>${sub}</small>`;
    ui.led = $('led');
    ui.prog.style.stroke = cls==='rec'?'var(--rec)':cls==='dub'?'var(--dub)':'var(--play)';
  }

  // ---- main footswitch ----
  async function mainPress(){
    if (!(await init())) return;
    if (ctx.state==='suspended') await ctx.resume();
    ui.foot.classList.add('down'); setTimeout(()=>ui.foot.classList.remove('down'),90);
    switch(state){
      case 'idle':
        capChunks=[]; capCount=0; capturing=true; state='recbase'; capStartTime=ctx.currentTime;
        setStatus('RECORDING','rec','SET','TAP TO CLOSE LOOP'); break;
      case 'recbase': finishBase(); break;
      case 'play': startDub(); break;
      case 'dub': finishDub(); break;
      case 'stopped': startPlayback(0); break;
    }
  }

  function concat(){
    const out = new Float32Array(capCount); let o=0;
    for (const c of capChunks){ out.set(c,o); o+=c.length; }
    return out;
  }

  function finishBase(){
    capturing=false;
    const data = concat();
    if (data.length < sr*0.2){ capChunks=[]; capCount=0; state='idle'; setStatus('TOO SHORT','', 'REC','TAP TO ARM'); return; }
    loopLen = data.length;
    const buf = ctx.createBuffer(1, loopLen, sr); buf.copyToChannel(data,0);
    addLayer(buf);
    startPlayback(0);
  }

  function startPlayback(offsetSamples){
    stopSources();
    const offset = offsetSamples/sr;
    const when = ctx.currentTime + 0.02;
    loopStart = when - offset;
    for (const L of layers) startLayer(L, when, offset);
    state='play'; setStatus('PLAYING','play','DUB','TAP TO OVERDUB');
  }
  function startLayer(L, when, offset){
    const s = ctx.createBufferSource(); s.buffer=L.buf; s.loop=true; s.connect(L.gain); s.start(when, offset); L.src=s;
  }
  function stopSources(){ for (const L of layers){ try{L.src&&L.src.stop();}catch(e){} L.src=null; } }

  function startDub(){
    capChunks=[]; capCount=0; capStartPos=Math.floor(posSamples()); capturing=true; state='dub';
    setStatus('OVERDUB','dub','DUB','TAP TO COMMIT');
  }
  function finishDub(){
    if (state!=='dub') return;
    capturing=false; state='play';
    const data = concat();
    const buf = ctx.createBuffer(1, loopLen, sr); const ch = buf.getChannelData(0);
    const n = Math.min(data.length, loopLen), lat = latencySamples();
    for (let i=0;i<n;i++){ let p = (capStartPos + i - lat) % loopLen; if (p<0) p+=loopLen; ch[p] = data[i]; }
    const L = addLayer(buf);
    const pos = posSamples();
    startLayer(L, ctx.currentTime, pos/sr);
    setStatus('PLAYING','play','DUB','TAP TO OVERDUB');
  }

  function addLayer(buf){
    const g = ctx.createGain(); g.connect(master);
    const L = {buf, gain:g, src:null, muted:false, vol:1};
    layers.push(L); renderLayers(); return L;
  }

  function stopAll(){
    if (!ctx) return;
    capturing=false; stopSources();
    if (state==='recbase'){ capChunks=[]; capCount=0; state='idle'; setStatus('READY','','REC','TAP TO ARM'); return; }
    state = layers.length ? 'stopped' : 'idle';
    setStatus(layers.length?'STOPPED':'READY','', layers.length?'PLAY':'REC', layers.length?'TAP TO RESTART':'TAP TO ARM');
    ui.prog.style.strokeDasharray = `0 ${CIRC}`;
  }
  function undo(){
    if (!layers.length || state==='recbase') return;
    if (state==='dub'){ capturing=false; capChunks=[]; state='play'; setStatus('PLAYING','play','DUB','TAP TO OVERDUB'); return; }
    const L = layers.pop(); try{L.src&&L.src.stop();}catch(e){} L.gain.disconnect();
    if (!layers.length){ loopLen=0; state='idle'; setStatus('READY','','REC','TAP TO ARM'); ui.prog.style.strokeDasharray=`0 ${CIRC}`; }
    renderLayers();
  }
  function clearAll(){
    capturing=false; stopSources(); layers.forEach(L=>L.gain.disconnect()); layers=[]; loopLen=0; capChunks=[]; capCount=0;
    state='idle'; setStatus('READY','','REC','TAP TO ARM'); ui.prog.style.strokeDasharray=`0 ${CIRC}`; renderLayers();
  }

  function renderLayers(){
    ui.layers.innerHTML = '';
    if (!layers.length){ ui.layers.innerHTML='<div class="empty">no layers yet — step on the switch to start</div>'; return; }
    layers.forEach((L,i)=>{
      const row = document.createElement('div'); row.className='layer';
      row.innerHTML = `<span class="name">${i===0?'BASE':'DUB '+i}</span>
        <input type="range" min="0" max="1.5" step="0.01" value="${L.vol}" aria-label="Layer ${i+1} volume">
        <button class="m ${L.muted?'off':''}" aria-label="Mute">${L.muted?'M':'●'}</button>
        <button class="x" aria-label="Delete layer">×</button>`;
      const [range, mute, del] = [row.querySelector('input'), row.querySelector('.m'), row.querySelector('.x')];
      range.oninput = () => { L.vol=parseFloat(range.value); L.gain.gain.value = L.muted?0:L.vol; };
      mute.onclick = () => { L.muted=!L.muted; L.gain.gain.value = L.muted?0:L.vol; renderLayers(); };
      del.onclick = () => { try{L.src&&L.src.stop();}catch(e){} L.gain.disconnect(); layers.splice(i,1); if(!layers.length) clearAll(); else renderLayers(); };
      ui.layers.appendChild(row);
    });
  }

  // ---- export mix as WAV ----
  async function exportWav(){
    if (!layers.length) return;
    const off = new OfflineAudioContext(1, loopLen, sr);
    for (const L of layers){ if (L.muted) continue; const s=off.createBufferSource(); s.buffer=L.buf; const g=off.createGain(); g.gain.value=L.vol; s.connect(g); g.connect(off.destination); s.start(0); }
    const r = await off.startRendering(); const d = r.getChannelData(0);
    const ab = new ArrayBuffer(44 + d.length*2), v = new DataView(ab);
    const w = (o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
    w(0,'RIFF'); v.setUint32(4,36+d.length*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true);
    v.setUint16(22,1,true); v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    w(36,'data'); v.setUint32(40,d.length*2,true);
    for (let i=0;i<d.length;i++){ const s=Math.max(-1,Math.min(1,d[i])); v.setInt16(44+i*2, s<0?s*0x8000:s*0x7fff, true); }
    const a = document.createElement('a'); a.href=URL.createObjectURL(new Blob([ab],{type:'audio/wav'})); a.download='loop.wav'; a.click();
  }

  // ---- meter + ring ----
  const meterBuf = new Uint8Array(512);
  function tick(){
    analyser.getByteTimeDomainData(meterBuf);
    let peak=0; for (let i=0;i<meterBuf.length;i++) peak=Math.max(peak,Math.abs(meterBuf[i]-128)/128);
    ui.meter.style.width = Math.min(100, peak*140)+'%';
    if (state==='recbase'){
      ui.time.textContent = fmt(ctx.currentTime - capStartTime);
      ui.prog.style.strokeDasharray = `${CIRC} 0`; ui.prog.style.opacity = (Math.floor(ctx.currentTime*2)%2)?'1':'.35';
    } else if (state==='play' || state==='dub'){
      ui.prog.style.opacity='1';
      const p = posSamples()/loopLen;
      ui.prog.style.strokeDasharray = `${p*CIRC} ${CIRC}`;
      ui.time.textContent = fmt(p*loopLen/sr)+' / '+fmt(loopLen/sr);
    } else if (state==='stopped'){ ui.prog.style.opacity='1'; ui.time.textContent='loop '+fmt(loopLen/sr); }
    else ui.time.textContent='no loop';
    requestAnimationFrame(tick);
  }

  // ---- wiring ----
  ui.foot.onclick = mainPress;
  $('stop').onclick = stopAll;
  $('undo').onclick = undo;
  $('clear').onclick = clearAll;
  $('export').onclick = exportWav;
  ui.monitor.onclick = async () => {
    if (!(await init())) return;
    monitoring=!monitoring; monGain.gain.value = monitoring?1:0;
    ui.monitor.textContent = monitoring?'MONITOR ON':'MONITOR OFF'; ui.monitor.classList.toggle('on',monitoring);
  };
  document.addEventListener('keydown', e => {
    if (e.target.tagName==='INPUT') return;
    if (e.code==='Space'){ e.preventDefault(); mainPress(); }
    else if (e.key==='s'||e.key==='S') stopAll();
    else if (e.key==='z'||e.key==='Z') undo();
  });
})();
</script>
</body>
</html>
